<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> SMTP -- Simple mail transfer protocal </title>

</head>
<body>

    <div class="container">

        <h2>SMTP -- Simple mail transfer protocal </h2>

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('smtp') }}" method="POST">

            <label for="sender_email">Sender Email</label>
            <input
                type="email"
                id="sender_email"
                name="sender_email"
                placeholder="Enter your Gmail address"
                required
            >
            <br><br>

            <label for="password">password</label>
            <input
                type="varchar"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >
            <br><br>

            <label for="to_email">Receiver Email</label>
            <input
                type="email"
                id="to_email"
                name="to_email"
                placeholder="Enter receiver email"
                required
            >
            <br><br>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Type your message here"
                required
            ></textarea>
            <br><br>

            <button type="submit">Send Email</button>
        </form>
    </div>
</body>
</html>
